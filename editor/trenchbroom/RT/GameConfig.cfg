{
    version: 9,
    name: "RT",
    "fileformats": [
        { "format": "Valve" }
    ],
    "filesystem": {
        "searchpath": ".",
        "packageformat": { "extension": ".pak", "format": "idpak" }
    },
    "materials": {
        "root": "textures",
        "format": { "extensions": [".tga"], "format": "image" }
    },
    "entities": {
        "definitions": [ "rt.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [
            { "name": "Trigger", "attribs": ["transparent"], "match": "classname",
              "pattern": "trigger*", "material": "rt/trigger" }
        ],
        "brushface": [
            { "name": "Skip", "attribs": ["transparent"], "match": "material", "pattern": "*skip" },
            { "name": "Clip", "attribs": ["transparent"], "match": "material", "pattern": "*clip" },
            { "name": "Trigger", "attribs": ["transparent"], "match": "material", "pattern": "*trigger" }
        ]
    },
    "faceattribs": {
        "surfaceflags": [],
        "contentflags": []
    }
}
